name: Release Please
on:
  push:
    branches:
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.repository }}-
    ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      released_packages: ${{ steps.released.outputs.packages }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      # 後続ジョブのmatrixで参照するため、パッケージごとの出力を1つのJSON配列に集約
      - name: Collect released packages
        id: released
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          packages="$(jq -c '
            . as $out
            | ($out.paths_released // "[]" | fromjson)
            | map({
                path: .,
                tag: $out["\(.)--tag_name"],
                sha: $out["\(.)--sha"]
              })
          ' <<< "$RELEASE_OUTPUTS")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

      # bun pm packはworkspace:*をbun.lockのversionで置換するため、リリースPRで同期
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Sync bun.lock workspace versions
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: release-please--branches--${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/sync-lockfile-versions.sh
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock workspace versions"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"

  publish-npm:
    name: Publish to npm (${{ matrix.package.path }})
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.released_packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
          no-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Wait for workspace dependencies
        uses: $/.github/actions/wait-for-workspace-deps
        with:
          working-directory: ${{ matrix.package.path }}

      - name: Apply publishConfig to manifest
        working-directory: ${{ matrix.package.path }}
        run: |
          jq '.exports = .publishConfig.exports | del(.publishConfig)' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Pack
        id: pack
        working-directory: ${{ matrix.package.path }}
        run: echo "tarball=$(bun pm pack --quiet | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: ${{ matrix.package.path }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance

  publish-jsr:
    name: Publish to JSR (${{ matrix.package.path }})
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.released_packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # プラグインが同梱するwasm/をビルドで生成
      - name: Build
        run: bun run build

      - name: Wait for workspace dependencies
        uses: $/.github/actions/wait-for-workspace-deps
        with:
          working-directory: ${{ matrix.package.path }}

      - name: Publish to JSR
        working-directory: ${{ matrix.package.path }}
        run: bunx jsr publish

  # npm・JSRへのpublishが全て成功してからGitHub Releaseを下書きから公開する
  publish-release:
    name: Publish GitHub releases
    needs:
      - release-please
      - publish-npm
      - publish-jsr
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish draft releases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGES: ${{ needs.release-please.outputs.released_packages }}
        run: |
          jq -r '.[].tag' <<< "$PACKAGES" | while read -r tag; do
            echo "Publishing release ${tag}"
            gh release edit "$tag" --draft=false
          done
